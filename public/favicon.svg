<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Subtle border highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Asset Management / Database Layers Symbol -->
  <!-- Top Layer -->
  <path d="M16 23.5 C16 20.5, 32 17, 32 17 C32 17, 48 20.5, 48 23.5 C48 26.5, 32 30, 32 30 C32 30, 16 26.5, 16 23.5 Z" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Middle Layer -->
  <path d="M16 31 C16 34, 32 37.5, 32 37.5 C32 37.5, 48 34, 48 31" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
  
  <!-- Bottom Layer -->
  <path d="M16 38.5 C16 41.5, 32 45, 32 45 C32 45, 48 41.5, 48 38.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
  
  <!-- Accent Node Dot -->
  <circle cx="43" cy="20" r="4.5" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="1.5" />
</svg>